# steplr_milestones:
#   - 100
#   - 200
#   - 300
#   - 400
# steplr_gamma: 0.1
lr_scheduler: CosineAnnealingLR
dataset: cifar10
dataset_path: data
model: resnet18_xai
random_seed: 10
num_workers: 4
pin_memory: True
non_blocking: True
prefetch: False
amp: False
device: cuda:0
frequency_save: 0
batch_size: 256
lr: 0.01
epochs: 20
pretrained: False
client_optimizer: sgd
sgd_momentum: 0.9
wd: 0.0005
